# Builds, validates and releases the v1.2.2 mounted HazMat carrier hotfix.
name: Build v1.2.2 MissionChief command pack

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - scripts/build_numbered_upload_package.py
      - tools/tkb-missionchief-bulk-uploader.user.js
      - data/vehicle-slots.json
      - assets/exports/standard/static/**
      - assets/exports/standard/animated/**
      - assets/exports/command/static/**
      - assets/exports/command/animated/**
      - assets/masters/v1.1/**
      - assets/masters/v1.2.2/**
      - data/prototypes.json
      - data/v1.2-enhancement-profile.json
      - scripts/build_hazardous_materials_pod_carrier.py
      - scripts/build_v1_1_enhanced.py
      - scripts/validate_v1_1_enhanced.py
      - docs/RELEASE_v1.2.2.md
      - .github/workflows/build-numbered-upload-package.yml
  push:
    branches:
      - main
    paths:
      - scripts/build_numbered_upload_package.py
      - tools/tkb-missionchief-bulk-uploader.user.js
      - data/vehicle-slots.json
      - assets/exports/standard/static/**
      - assets/exports/standard/animated/**
      - assets/exports/command/static/**
      - assets/exports/command/animated/**
      - assets/masters/v1.1/**
      - assets/masters/v1.2.2/**
      - data/prototypes.json
      - data/v1.2-enhancement-profile.json
      - scripts/build_hazardous_materials_pod_carrier.py
      - scripts/build_v1_1_enhanced.py
      - scripts/validate_v1_1_enhanced.py
      - docs/RELEASE_v1.2.2.md
      - .github/workflows/build-numbered-upload-package.yml

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate bulk uploader syntax
        run: node --check tools/tkb-missionchief-bulk-uploader.user.js

      - name: Install image build dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Verify deterministic mounted HazMat carrier master
        run: python scripts/build_hazardous_materials_pod_carrier.py --check

      - name: Build Modern Command Clarity exports
        run: python scripts/build_v1_1_enhanced.py

      - name: Run dense-map and animation release gate
        run: python scripts/validate_v1_1_enhanced.py

      - name: Build and validate numbered package
        run: python scripts/build_numbered_upload_package.py --version v1.2.2 --profile command

      - name: Stage bulk uploader release asset
        run: cp tools/tkb-missionchief-bulk-uploader.user.js dist/TKB-MissionChief-UK-Graphics-Bulk-Uploader-v1.2.2.user.js

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: missionchief-modern-command-clarity-v1.2.2
          path: |
            dist/TKB-UK-Emergency-Fleet-Modern-Command-Clarity-MissionChief-Numbered-Upload-Ready-v1.2.2.zip
            dist/TKB-UK-Emergency-Fleet-Modern-Command-Clarity-MissionChief-Numbered-Upload-Ready-v1.2.2.zip.sha256
            dist/TKB-MissionChief-UK-Graphics-Bulk-Uploader-v1.2.2.user.js
            data/v1.2.2-build-report.json
            data/v1.2.2-qa-report.json
            assets/previews/v1.2.2/*.png
          if-no-files-found: error
          retention-days: 90

      - name: Create or update v1.2.2 release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.2.2 >/dev/null 2>&1 || gh release create v1.2.2 --target main --title "v1.2.2 — Mounted HazMat Carrier Hotfix" --notes-file docs/RELEASE_v1.2.2.md
          gh release upload v1.2.2 \
            dist/TKB-UK-Emergency-Fleet-Modern-Command-Clarity-MissionChief-Numbered-Upload-Ready-v1.2.2.zip \
            dist/TKB-UK-Emergency-Fleet-Modern-Command-Clarity-MissionChief-Numbered-Upload-Ready-v1.2.2.zip.sha256 \
            dist/TKB-MissionChief-UK-Graphics-Bulk-Uploader-v1.2.2.user.js \
            data/v1.2.2-build-report.json \
            data/v1.2.2-qa-report.json \
            --clobber
