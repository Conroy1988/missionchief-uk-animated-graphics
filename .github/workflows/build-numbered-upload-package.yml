# Builds, validates and releases the complete v2.0.0 direction-neutral fleet.
name: Build v2.0.0 MissionChief direction-neutral fleet

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - assets/exports/v2/**
      - assets/masters/v2.0.0/**
      - assets/previews/v2.0.0/**
      - data/vehicle-slots.json
      - data/prototypes.json
      - data/v2.0.0-*.json
      - docs/RELEASE_v2.0.0.md
      - docs/CHECKPOINT_v2.0.0.md
      - docs/V2_DIRECTION_NEUTRAL_STANDARD.md
      - scripts/apng_full_frame.py
      - scripts/build_numbered_upload_package.py
      - scripts/build_v2_animated_fleet.py
      - scripts/v2_emergency_light.py
      - scripts/validate_v2_animated_fleet.py
      - scripts/validate_v2_release_integrity.py
      - scripts/validate_v2_static_fleet.py
      - .github/workflows/build-numbered-upload-package.yml
  push:
    branches:
      - main
    paths:
      - assets/exports/v2/**
      - assets/masters/v2.0.0/**
      - assets/previews/v2.0.0/**
      - data/vehicle-slots.json
      - data/prototypes.json
      - data/v2.0.0-*.json
      - docs/RELEASE_v2.0.0.md
      - docs/CHECKPOINT_v2.0.0.md
      - docs/V2_DIRECTION_NEUTRAL_STANDARD.md
      - scripts/apng_full_frame.py
      - scripts/build_numbered_upload_package.py
      - scripts/build_v2_animated_fleet.py
      - scripts/v2_emergency_light.py
      - scripts/validate_v2_animated_fleet.py
      - scripts/validate_v2_release_integrity.py
      - scripts/validate_v2_static_fleet.py
      - .github/workflows/build-numbered-upload-package.yml

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history and release tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image validation dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Compile release tooling
        run: python -m compileall -q scripts

      - name: Verify all 117 static direction-neutral assets
        run: python scripts/validate_v2_static_fleet.py

      - name: Rebuild all 117 response APNGs and fixture metadata
        run: python scripts/build_v2_animated_fleet.py

      - name: Verify emergency-light visibility, placement, timing and APNG controls
        run: python scripts/validate_v2_animated_fleet.py

      - name: Build deterministic numbered MissionChief package
        run: python scripts/build_numbered_upload_package.py --version v2.0.0 --profile v2

      - name: Run complete release-integrity gate
        run: python scripts/validate_v2_release_integrity.py

      - name: Upload verified v2.0.0 workflow evidence
        uses: actions/upload-artifact@v4
        with:
          name: missionchief-direction-neutral-fleet-v2.0.0
          path: |
            dist/TKB-UK-Emergency-Fleet-Direction-Neutral-MissionChief-Numbered-Upload-Ready-v2.0.0.zip
            dist/TKB-UK-Emergency-Fleet-Direction-Neutral-MissionChief-Numbered-Upload-Ready-v2.0.0.zip.sha256
            data/v2.0.0-animation-build-report.json
            data/v2.0.0-animation-qa-report.json
            data/v2.0.0-light-fixtures.json
            data/v2.0.0-release-integrity-report.json
            data/v2.0.0-static-qa-report.json
            assets/previews/v2.0.0/*.png
          if-no-files-found: error
          retention-days: 90

      - name: Create or update v2.0.0 release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.0.0 >/dev/null 2>&1 || gh release create v2.0.0 --target main --title "v2.0.0 — Direction-Neutral Emergency Fleet" --notes-file docs/RELEASE_v2.0.0.md
          gh release upload v2.0.0 \
            dist/TKB-UK-Emergency-Fleet-Direction-Neutral-MissionChief-Numbered-Upload-Ready-v2.0.0.zip \
            dist/TKB-UK-Emergency-Fleet-Direction-Neutral-MissionChief-Numbered-Upload-Ready-v2.0.0.zip.sha256 \
            data/v2.0.0-animation-build-report.json \
            data/v2.0.0-animation-qa-report.json \
            data/v2.0.0-light-fixtures.json \
            data/v2.0.0-release-integrity-report.json \
            data/v2.0.0-static-qa-report.json \
            --clobber
