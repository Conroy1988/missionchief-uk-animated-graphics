name: Import v1.1 release payload

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Release branch containing transport archives
        required: true
        default: agent/v1.1-modern-command-visibility

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      - name: Verify transport payloads
        run: |
          echo "f5a14d196dd5f6fc3a216d20a38bd7181b667a2168c9723d4443c9cca367fff5  transport/v1.1-core.tar.gz" | sha256sum -c -
          echo "9a149ba20ff4a77b5308106c345e8202db1bc89668b776390eef8939457d93d7  transport/v1.1-animated.tar.gz" | sha256sum -c -

      - name: Import exact tested release
        run: |
          tar -xzf transport/v1.1-core.tar.gz -C .
          tar -xzf transport/v1.1-animated.tar.gz -C .
          rm -rf transport

      - name: Validate imported fleet
        run: |
          test "$(find assets/exports/command/static -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 117
          test "$(find assets/exports/command/animated -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 117
          python -m pip install --disable-pip-version-check Pillow
          python scripts/validate_v1_1_enhanced.py
          python - <<'PY'
          import json
          with open('data/v1.1-qa-report.json', encoding='utf-8') as handle:
              assert json.load(handle)['all_passed'] is True
          PY

      - name: Commit validated release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v1.1 modern command visibility fleet"
          git push origin "HEAD:${{ inputs.target_branch }}"
