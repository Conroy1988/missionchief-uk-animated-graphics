<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="title desc"><title id="title">TKB UK Emergency Fleet</title><desc id="desc">120 vehicles. 240 assets. Direction neutral. Updated response animation. Black, red and white TKB identity.</desc><rect width="1280" height="380" rx="16" fill="#09090c"/><path d="M860 0H1280V380H1040Z" fill="#181014"/><path d="M1080 0H1150L900 380H830Z" fill="#e3263d" opacity=".18"/><path d="M1180 0H1200L950 380H930Z" fill="#e3263d" opacity=".35"/><rect x="56" y="54" width="70" height="12" rx="2" fill="#ed263e"/><rect x="56" y="76" width="70" height="12" rx="2" fill="#ed263e"/><text x="151" y="79" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="5">TKB GAMING</text><text x="56" y="168" fill="#fff" font-family="Arial,sans-serif" font-size="57" font-weight="800">UK EMERGENCY FLEET</text><text x="58" y="215" fill="#b9b9c3" font-family="Arial,sans-serif" font-size="22">Built for the map. Ready for the response.</text><path d="M56 254H1224" stroke="#303036"/><text x="58" y="310" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">120 VEHICLES</text><text x="327" y="310" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">240 ASSETS</text><text x="596" y="310" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">110 × 110</text><text x="935" y="310" fill="#ff6578" font-family="Arial,sans-serif" font-size="25" font-weight="700">LIVE FLEET</text></svg>